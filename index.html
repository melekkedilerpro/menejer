<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro 11 Futbol Menajeri 2026</title>
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: #131d35;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.3);
            --blue: #2979ff;
            --red: #ff1744;
            --gold: #ffc107;
            --text: #ffffff;
            --text-muted: #8a99ad;
            --border: #1f2d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-main); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        nav { width: 240px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 10px; gap: 8px; }
        .logo { font-size: 1.2rem; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 20px; letter-spacing: 1px; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .header-stats { display: flex; gap: 20px; font-size: 0.9rem; }
        .badge { background: var(--accent); color: #000; padding: 4px 10px; border-radius: 4px; font-weight: bold; }

        .tab-content { padding: 25px; display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        h2 { margin-bottom: 15px; color: var(--accent); font-size: 1.2rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; position: sticky; top: 0; background: var(--bg-card); }
        .table-scroll { max-height: 480px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }

        .btn { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); }

        /* Başlangıç Seçim Modalı */
        #teamSelectModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 550px; max-width: 90%; }

        /* Pro 11 Maç Sahnesi */
        .match-arena { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }
        .pitch-container { background: #0e4429; border: 2px solid #00e676; border-radius: 10px; height: 440px; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,230,118,0.15); }
        canvas { width: 100%; height: 100%; display: block; }
        
        .scoreboard { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 29, 0.9); border: 1px solid var(--border); padding: 8px 20px; border-radius: 20px; display: flex; gap: 15px; align-items: center; font-weight: bold; font-size: 1rem; z-index: 5; }
        .score-num { color: var(--accent); font-size: 1.3rem; }

        .logs-box { background: #0a0f1d; border: 1px solid var(--border); border-radius: 10px; height: 440px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .log-item { padding: 8px 12px; border-radius: 6px; background: rgba(255,255,255,0.03); border-left: 3px solid transparent; }
        .log-item.goal { background: rgba(0, 230, 118, 0.15); border-left-color: var(--accent); font-weight: bold; }
        
        .fixtures-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .fixture-card { background: #0a0f1d; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <!-- KULÜP SEÇİMİ -->
    <div id="teamSelectModal">
        <div class="modal-box">
            <h2 style="text-align:center;">⚽ Kulübünü Seç</h2>
            <div style="margin: 15px 0;">
                <label style="font-size:0.8rem; color:var(--text-muted);">Lig Seçimi:</label>
                <select id="modal-league-select" onchange="populateModalTeams(this.value)" style="width:100%; padding:10px; background:#0a0f1d; color:#fff; border:1px solid var(--border); border-radius:6px; margin-top:5px;">
                    <option value="Süper Lig">Türkiye: Süper Lig (20 Takım)</option>
                    <option value="1. Lig">Türkiye: 1. Lig (20 Takım)</option>
                    <option value="Premier League">İngiltere: Premier League</option>
                    <option value="La Liga">İspanya: La Liga</option>
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:0.8rem; color:var(--text-muted);">Takım Seç:</label>
                <select id="modal-team-select" style="width:100%; padding:10px; background:#0a0f1d; color:#fff; border:1px solid var(--border); border-radius:6px; margin-top:5px;"></select>
            </div>
            <button class="btn" style="width:100%; padding:12px;" onclick="confirmTeamSelection()">Oyuna Başla</button>
        </div>
    </div>

    <!-- YAN MENÜ -->
    <nav>
        <div class="logo">PRO 11 2026</div>
        <button class="nav-btn active" onclick="switchTab('tab-dash', this)">🏠 Kulüp & Taktik</button>
        <button class="nav-btn" onclick="switchTab('tab-squad', this)">👥 Kadro</button>
        <button class="nav-btn" onclick="switchTab('tab-transfers', this)">💼 Transfer Pazarı</button>
        <button class="nav-btn" onclick="switchTab('tab-league', this)">🏆 20 Takımlı Lig</button>
        <button class="nav-btn" onclick="switchTab('tab-match', this)">⚽ Pro 11 Canlı Maç</button>
    </nav>

    <!-- ANA EKRAN -->
    <main>
        <header>
            <div class="header-stats">
                <span>Kulüp: <b id="head-club">-</b></span>
                <span>Lig: <b id="head-league">-</b></span>
                <span>Hafta: <b id="head-week">1</b> / 38</span>
            </div>
            <div>Bütçe: <span class="badge" id="head-budget">€0</span></div>
        </header>

        <!-- KULÜP -->
        <div id="tab-dash" class="tab-content active">
            <div class="card">
                <h2>Kulüp Yönetimi & Taktik</h2>
                <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                    <div>
                        <label style="font-size:0.8rem; color:var(--text-muted);">Diziliş:</label><br>
                        <select id="tac-formation" onchange="updateFormation(this.value)" style="background:#0a0f1d; color:#fff; border:1px solid var(--border); padding:8px; border-radius:6px; margin-top:5px;">
                            <option value="4-3-3">4-3-3 Hücum</option>
                            <option value="4-4-2">4-4-2 Klasik</option>
                            <option value="3-5-2">3-5-2 Pres</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- KADRO -->
        <div id="tab-squad" class="tab-content">
            <div class="card">
                <h2>Oyuncu Kadrosu</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>Mevki</th><th>Oyuncu</th><th>OVR</th><th>Yaş</th><th>Değer</th><th>Moral</th></tr></thead>
                        <tbody id="squad-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TRANSFER -->
        <div id="tab-transfers" class="tab-content">
            <div class="card">
                <h2>Transfer Pazarı</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>Mevki</th><th>Oyuncu</th><th>Kulübü</th><th>OVR</th><th>Fiyat</th><th>İşlem</th></tr></thead>
                        <tbody id="transfer-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- LİG -->
        <div id="tab-league" class="tab-content">
            <div class="card">
                <h2 id="league-name-heading">Puan Durumu</h2>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Av</th><th>P</th></tr></thead>
                        <tbody id="league-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PRO 11 MAÇ EKRANI -->
        <div id="tab-match" class="tab-content">
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="match-fixture-title">Haftanın Maçı</h2>
                <button class="btn" id="btn-play-match" onclick="startPro11Match()">Maçı Başlat (Pro 11 Motoru)</button>
            </div>
            <div class="match-arena">
                <div class="pitch-container">
                    <div class="scoreboard">
                        <span id="sb-home">EV</span>
                        <span class="score-num" id="sb-score">0 - 0</span>
                        <span id="sb-away">DEP</span>
                        <span style="color:var(--gold);" id="sb-min">0'</span>
                    </div>
                    <canvas id="pro11Canvas"></canvas>
                </div>
                <div class="logs-box" id="matchLogs">
                    <div class="log-item">Takımlar taktiksel yerleşimini aldı.</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const DB = {
            week: 1, currentLeague: "Süper Lig", userTeam: "Galatasaray", budget: 35000000,
            formation: "4-3-3", fixtures: {},
            leagues: {
                "Süper Lig": [
                    { name: "Galatasaray", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:84 },
                    { name: "Fenerbahçe", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:83 },
                    { name: "Beşiktaş", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:81 },
                    { name: "Trabzonspor", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:79 },
                    { name: "Başakşehir", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:77 },
                    { name: "Samsunspor", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:76 },
                    { name: "Eyüpspor", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:75 },
                    { name: "Göztepe", p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, ovr:75 }
                ]
            },
            squad: [
                { pos: "GK", name: "F. Muslera", ovr: 81, age: 39, price: 2000000, moral: 100 },
                { pos: "RB", name: "K. Ayhan", ovr: 77, age: 30, price: 4500000, moral: 100 },
                { pos: "CB", name: "D. Sánchez", ovr: 83, age: 29, price: 18000000, moral: 100 },
                { pos: "CB", name: "A. Bardakcı", ovr: 80, age: 30, price: 8500000, moral: 100 },
                { pos: "LB", name: "I. Jakobs", ovr: 78, age: 26, price: 7000000, moral: 100 },
                { pos: "CM", name: "L. Torreira", ovr: 83, age: 29, price: 16000000, moral: 100 },
                { pos: "CM", name: "G. Sara", ovr: 81, age: 26, price: 18000000, moral: 100 },
                { pos: "CAM", name: "D. Mertens", ovr: 80, age: 38, price: 3000000, moral: 100 },
                { pos: "RW", name: "B. A. Yılmaz", ovr: 80, age: 25, price: 15000000, moral: 100 },
                { pos: "LW", name: "Y. Akgün", ovr: 78, age: 25, price: 8000000, moral: 100 },
                { pos: "ST", name: "V. Osimhen", ovr: 87, age: 26, price: 75000000, moral: 100 }
            ],
            market: [
                { pos: "CAM", name: "A. Güler", club: "Real Madrid", ovr: 83, price: 25000000 },
                { pos: "CM", name: "O. Kökçü", club: "Benfica", ovr: 82, price: 18000000 },
                { pos: "LW", name: "K. Aktürkoğlu", club: "Benfica", ovr: 81, price: 16000000 },
                { pos: "ST", name: "E. Haaland", club: "Man City", ovr: 91, price: 180000000 }
            ]
        };

        function populateModalTeams(l) {
            const sel = document.getElementById('modal-team-select');
            sel.innerHTML = '';
            (DB.leagues[l] || DB.leagues["Süper Lig"]).forEach(t => {
                sel.innerHTML += `<option value="${t.name}">${t.name} (${t.ovr} OVR)</option>`;
            });
        }

        function confirmTeamSelection() {
            DB.userTeam = document.getElementById('modal-team-select').value;
            DB.currentLeague = document.getElementById('modal-league-select').value;
            document.getElementById('teamSelectModal').style.display = 'none';
            renderAll();
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            renderAll();
        }

        function renderAll() {
            document.getElementById('head-club').innerText = DB.userTeam;
            document.getElementById('head-league').innerText = DB.currentLeague;
            document.getElementById('head-week').innerText = DB.week;
            document.getElementById('head-budget').innerText = "€" + DB.budget.toLocaleString();

            // Kadro
            const sq = document.getElementById('squad-tbody');
            sq.innerHTML = '';
            DB.squad.forEach(p => {
                sq.innerHTML += `<tr><td><b>${p.pos}</b></td><td>${p.name}</td><td>${p.ovr}</td><td>${p.age}</td><td>€${p.price.toLocaleString()}</td><td>%${p.moral}</td></tr>`;
            });

            // Transfer
            const tr = document.getElementById('transfer-tbody');
            tr.innerHTML = '';
            DB.market.forEach((p, i) => {
                tr.innerHTML += `<tr><td><b>${p.pos}</b></td><td>${p.name}</td><td>${p.club}</td><td>${p.ovr}</td><td>€${p.price.toLocaleString()}</td><td><button class="btn" onclick="buyPlayer(${i})">Al</button></td></tr>`;
            });

            // Lig
            const lg = document.getElementById('league-tbody');
            lg.innerHTML = '';
            const teams = [...(DB.leagues[DB.currentLeague] || DB.leagues["Süper Lig"])].sort((a,b) => b.pts - a.pts);
            teams.forEach((t, i) => {
                let bg = t.name === DB.userTeam ? 'background:rgba(0,230,118,0.15); font-weight:bold;' : '';
                lg.innerHTML += `<tr style="${bg}"><td>${i+1}</td><td>${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`;
            });

            document.getElementById('match-fixture-title').innerText = `${DB.week}. Hafta Karşılaşması`;
            drawPro11Pitch();
        }

        function buyPlayer(idx) {
            const p = DB.market[idx];
            if (DB.budget >= p.price) {
                DB.budget -= p.price;
                DB.squad.push({ pos: p.pos, name: p.name, ovr: p.ovr, age: 24, price: p.price, moral: 100 });
                DB.market.splice(idx, 1);
                renderAll();
                alert(`${p.name} transfer edildi!`);
            } else alert("Yetersiz bütçe!");
        }

        // ==========================================
        // PRO 11 TAKTİKSEL SAHA VE MAÇ MOTORU
        // ==========================================
        function getFormationNodes(w, h) {
            // Pro 11 4-3-3 Taktik Dizilimi (Sol Takım / Mavi - Sağ Takım / Kırmızı)
            return {
                home: [
                    { x: w * 0.08, y: h * 0.5, num: "1", pos: "GK" },
                    { x: w * 0.22, y: h * 0.2, num: "2", pos: "RB" },
                    { x: w * 0.18, y: h * 0.4, num: "3", pos: "CB" },
                    { x: w * 0.18, y: h * 0.6, num: "4", pos: "CB" },
                    { x: w * 0.22, y: h * 0.8, num: "5", pos: "LB" },
                    { x: w * 0.35, y: h * 0.3, num: "6", pos: "CM" },
                    { x: w * 0.32, y: h * 0.5, num: "8", pos: "CM" },
                    { x: w * 0.35, y: h * 0.7, num: "10", pos: "CAM" },
                    { x: w * 0.45, y: h * 0.2, num: "7", pos: "RW" },
                    { x: w * 0.45, y: h * 0.8, num: "11", pos: "LW" },
                    { x: w * 0.48, y: h * 0.5, num: "9", pos: "ST" }
                ],
                away: [
                    { x: w * 0.92, y: h * 0.5, num: "1", pos: "GK" },
                    { x: w * 0.78, y: h * 0.2, num: "2", pos: "LB" },
                    { x: w * 0.82, y: h * 0.4, num: "3", pos: "CB" },
                    { x: w * 0.82, y: h * 0.6, num: "4", pos: "CB" },
                    { x: w * 0.78, y: h * 0.8, num: "5", pos: "RB" },
                    { x: w * 0.65, y: h * 0.3, num: "6", pos: "CM" },
                    { x: w * 0.68, y: h * 0.5, num: "8", pos: "CM" },
                    { x: w * 0.65, y: h * 0.7, num: "10", pos: "CAM" },
                    { x: w * 0.55, y: h * 0.2, num: "11", pos: "LW" },
                    { x: w * 0.55, y: h * 0.8, num: "7", pos: "RW" },
                    { x: w * 0.52, y: h * 0.5, num: "9", pos: "ST" }
                ]
            };
        }

        function drawPro11Pitch(ballX, ballY, passTargetX, passTargetY) {
            const canvas = document.getElementById('pro11Canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            const w = canvas.width, h = canvas.height;

            // Saha Arka Planı (Çim Çizgili)
            ctx.fillStyle = "#0e4429"; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "rgba(0,0,0,0.06)";
            for(let i=0; i<w; i+=w/8) { ctx.fillRect(i, 0, w/16, h); }

            // Çizgiler
            ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
            ctx.strokeRect(15, 15, w - 30, h - 30);
            ctx.beginPath(); ctx.moveTo(w/2, 15); ctx.lineTo(w/2, h-15); ctx.stroke();
            ctx.beginPath(); ctx.arc(w/2, h/2, 45, 0, Math.PI*2); ctx.stroke();
            
            // Ceza Sahaları
            ctx.strokeRect(15, h/2 - 60, 70, 120);
            ctx.strokeRect(w - 85, h/2 - 60, 70, 120);

            const nodes = getFormationNodes(w, h);

            // Oyuncu Daireleri (Home - Mavi)
            nodes.home.forEach(p => {
                ctx.fillStyle = "#2979ff"; ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.num, p.x, p.y);
            });

            // Oyuncu Daireleri (Away - Kırmızı)
            nodes.away.forEach(p => {
                ctx.fillStyle = "#ff1744"; ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.num, p.x, p.y);
            });

            // Pas Çizgisi (Pro 11 Stili Kesikli Çizgi)
            if (passTargetX !== undefined) {
                ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(ballX, ballY); ctx.lineTo(passTargetX, passTargetY); ctx.stroke();
                ctx.setLineDash([]);
            }

            // Top
            ctx.fillStyle = "#ffffff"; ctx.beginPath();
            ctx.arc(ballX || w/2, ballY || h/2, 5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
        }

        function startPro11Match() {
            const btn = document.getElementById('btn-play-match');
            btn.disabled = true;
            const canvas = document.getElementById('pro11Canvas');
            const w = canvas.width, h = canvas.height;
            const logs = document.getElementById('matchLogs');
            logs.innerHTML = '';

            let min = 0, uScore = 0, oppScore = 0;
            const nodes = getFormationNodes(w, h);

            document.getElementById('sb-home').innerText = DB.userTeam;
            document.getElementById('sb-away').innerText = "Rakip";

            const timer = setInterval(() => {
                min += 10;
                document.getElementById('sb-min').innerText = min + "'";

                // Rastgele Paslaşma Animasyonu
                const isUser = Math.random() > 0.45;
                const pool = isUser ? nodes.home : nodes.away;
                const p1 = pool[Math.floor(Math.random()*pool.length)];
                const p2 = pool[Math.floor(Math.random()*pool.length)];
                drawPro11Pitch(p1.x, p1.y, p2.x, p2.y);

                if (Math.random() > 0.6) {
                    if (isUser) {
                        uScore++;
                        logs.innerHTML += `<div class="log-item goal">⚽ ${min}' GOOOL! ${DB.userTeam} (${p1.pos} ${p1.num} vurdu ve gol!)</div>`;
                    } else {
                        oppScore++;
                        logs.innerHTML += `<div class="log-item goal">⚽ ${min}' GOL! Rakip ağları havalandırdı.</div>`;
                    }
                    document.getElementById('sb-score').innerText = `${uScore} - ${oppScore}`;
                } else {
                    logs.innerHTML += `<div class="log-item">${min}' Taktiksel paslaşma, top orta alanda.</div>`;
                }
                logs.scrollTop = logs.scrollHeight;

                if (min >= 90) {
                    clearInterval(timer);
                    btn.disabled = false;
                    logs.innerHTML += `<div class="log-item" style="background:#131d35; font-weight:bold;">🏁 Maç Bitti: ${DB.userTeam} ${uScore} - ${oppScore} Rakip</div>`;
                    
                    // Puan işle
                    const user = DB.leagues[DB.currentLeague].find(t => t.name === DB.userTeam);
                    if(user) {
                        user.p++; user.gf += uScore; user.ga += oppScore;
                        if(uScore > oppScore) { user.w++; user.pts += 3; DB.budget += 1500000; }
                        else if(uScore === oppScore) { user.d++; user.pts += 1; DB.budget += 500000; }
                        else { user.l++; }
                    }
                    DB.week++;
                    renderAll();
                }
            }, 600);
        }

        window.onload = () => {
            populateModalTeams("Süper Lig");
        };
    </script>
</body>
</html>
